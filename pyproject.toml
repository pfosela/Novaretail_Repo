[project]
name = "novaretail"
version = "0.1.0"
description = "Plataforma de datos y soporte a la decisión para NovaRetail (Unit 17 · Business Process Support)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.2",
    "pyarrow>=15",
    "duckdb>=1.0",
    "pandera>=0.20",
    "pydantic>=2.6",
    "requests>=2.31",
    "faker>=25",
    "reportlab>=4.0",
    "pdfplumber>=0.11",
    "beautifulsoup4>=4.12",
    "matplotlib>=3.8",
    "ipykernel>=6.29",
]

[project.scripts]
novaretail = "novaretail.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/novaretail"]

[tool.pytest.ini_options]
testpaths = ["tests"]
